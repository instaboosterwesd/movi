<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net79</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #openBtn {
    position: fixed; bottom: 16px; right: 16px;
    padding: 10px 16px; background: #1a73e8; color: #fff;
    border: none; border-radius: 8px; font-size: 14px;
    font-family: sans-serif; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    z-index: 10;
  }
</style>
</head>
<body>
<iframe src="https://net79.cc/" allow="fullscreen"></iframe>
<button id="openBtn" onclick="window.open('https://net79.cc/', '_blank')">Open in new tab</button>
</body>
</html>
